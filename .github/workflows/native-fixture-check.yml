name: Temporary Android fixture verification
on:
  pull_request:
    paths:
      - 'tools/run_android_acceptance.py'
      - '.github/workflows/native-fixture-check.yml'
permissions:
  contents: read
  actions: read
jobs:
  native-24:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixture application sources have not changed
        run: git diff --exit-code 9d037f33118e5423a7c43956570e2b4440a137cd HEAD -- lib android assets pubspec.yaml pubspec.lock tools/android_acceptance.dart tools/build_android_acceptance.py tools/fixtures .github/workflows/android.yml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 36999580510
          name: android-acceptance-c771be765d00d2b0737d8ee89b4009cfd488827e
          path: acceptance-apks
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo setfacl -m u:"$USER":rw /dev/kvm
      - name: Verify native upgrade, files and background tasks
        run: python3 tools/run_android_acceptance.py --api 24 --apks acceptance-apks --output acceptance-results
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-24-fixture-${{ github.sha }}
          path: acceptance-results/
          retention-days: 14
