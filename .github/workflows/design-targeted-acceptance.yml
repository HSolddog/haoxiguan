name: Original design targeted acceptance

on:
  push:
    branches:
      - codex/haoxiguan-design-targeted-acceptance-20261004
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-targeted-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  nextcloud:
    name: Current-source Nextcloud interoperability
    if: ${{ !contains(github.event.head_commit.message, '[page16k-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure isolated Flutter paths
        run: |
          echo "PUB_CACHE=$RUNNER_TEMP/haoxiguan-pub-cache" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.tooling/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: flutter/flutter
          ref: 3.44.6
          path: .tooling/flutter
          persist-credentials: false
      - name: Verify pinned Flutter source
        run: test "$(git -C .tooling/flutter rev-parse HEAD)" = "ee80f08bbf97172ec030b8751ceab557177a34a6"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .tooling/flutter/bin/cache
            ${{ env.PUB_CACHE }}
          key: flutter-3.44.6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache-dependency-path: server/go.sum
      - name: Check only targeted Dart formatting and analysis
        run: |
          dart format --output=none --set-exit-if-changed lib/services/webdav_client.dart test/webdav_client_test.dart test/nextcloud_integration_test.dart
          dart analyze lib/services/webdav_client.dart
          dart analyze test/webdav_client_test.dart
          dart analyze test/nextcloud_integration_test.dart
      - name: Verify DAV conditions and representation behavior
        run: flutter test --no-pub --reporter=expanded test/webdav_client_test.dart test/webdav_capability_test.dart
      - name: Verify Nextcloud runner isolation
        run: python3 -m unittest discover -s tools -p test_nextcloud_integration_runner.py -v
      - name: Real Nextcloud TLS recovery and access probe
        run: python3 tools/run_nextcloud_integration.py --output build/nextcloud-integration --startup-timeout 600 --test-timeout 900
      - name: Install existing pinned isolated WsgiDAV service
        run: |
          python3 -m venv "$RUNNER_TEMP/haoxiguan-webdav-venv"
          "$RUNNER_TEMP/haoxiguan-webdav-venv/bin/python" -m pip install --disable-pip-version-check -r tools/webdav-test-requirements.txt
      - name: Verify the same client against WsgiDAV TLS
        timeout-minutes: 7
        run: '"$RUNNER_TEMP/haoxiguan-webdav-venv/bin/python" tools/run_webdav_integration.py'
      - name: Preserve sanitized Nextcloud evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextcloud-current-${{ github.sha }}
          path: build/nextcloud-integration/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve WsgiDAV evidence for the client fix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wsgidav-current-${{ github.sha }}
          path: build/webdav-integration/
          if-no-files-found: warn
          retention-days: 14

  page16k:
    name: Official 16 KiB emulator runtime
    if: ${{ !contains(github.event.head_commit.message, '[nextcloud-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure isolated Flutter paths
        run: |
          echo "PUB_CACHE=$RUNNER_TEMP/haoxiguan-pub-cache" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.tooling/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: flutter/flutter
          ref: 3.44.6
          path: .tooling/flutter
          persist-credentials: false
      - name: Verify pinned Flutter source
        run: test "$(git -C .tooling/flutter rev-parse HEAD)" = "ee80f08bbf97172ec030b8751ceab557177a34a6"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .tooling/flutter/bin/cache
            ${{ env.PUB_CACHE }}
          key: flutter-3.44.6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify native driver and fixture restoration
        run: python3 -m unittest discover -s tools -p 'test_android_acceptance*.py' -v
      - name: Build current regular Debug
        run: |
          flutter build apk --debug --target-platform android-x64
          mkdir -p build/product-startup
          cp build/app/outputs/flutter-apk/app-debug.apk build/product-startup/haoxiguan-debug.apk
      - name: Build existing isolated upgrade fixtures
        run: python3 tools/build_android_acceptance.py
      - name: Allow this ephemeral runner to use KVM
        run: |
          test -c /dev/kvm
          sudo setfacl -m u:"$USER":rw /dev/kvm
      - name: Strict 16384-page runtime and existing four native phases
        run: |
          python3 tools/run_android_acceptance.py \
            --api 35 --image-target google_apis_ps16k --expected-page-size 16384 --memory-mb 4096 \
            --product-apk build/product-startup/haoxiguan-debug.apk \
            --apks build/acceptance --output build/page16k-acceptance
      - name: Preserve 16 KiB page and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: page16k-current-${{ github.sha }}
          path: build/page16k-acceptance/
          if-no-files-found: warn
          retention-days: 14
