services:
  sync:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${HAOXIGUAN_ARCH:-amd64}
    image: haoxiguan-sync:local
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - '${HAOXIGUAN_DATA_DIR:?Set an absolute owned data directory}:/data'
